name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test

  verify-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: rm -rf dist
      - run: bun run compile
      - run: git diff --exit-code -- dist
      - run: test -z "$(git status --porcelain --untracked-files=all -- dist)"

  package-dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - test
      - verify-build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Install exact npm version
        run: npm install --global npm@11.19.0
      - name: Print tool versions
        run: |
          bun --version
          node --version
          npm --version
          gh --version
      - run: bun install --frozen-lockfile
      - name: Verify release package without retaining artifacts
        run: node ./scripts/release-package.mjs

  package-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - verify-build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Install exact npm version
        run: npm install --global npm@11.19.0
      - name: Print tool versions
        run: |
          bun --version
          node --version
          npm --version
          gh --version
      - run: bun install --frozen-lockfile
      - name: Resolve validated package identity
        id: package-identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const releaseTag = process.env.RELEASE_TAG;
          const outputFile = process.env.GITHUB_OUTPUT;
          if (manifest.name !== "opencode-startup-commands") {
            throw new Error("Unexpected package name");
          }
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(manifest.version)) {
            throw new Error("Package version must be strict semantic versioning");
          }
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(releaseTag ?? "")) {
            throw new Error("Release tag must be strict semantic versioning");
          }
          const expectedTag = `v${manifest.version}`;
          if (releaseTag !== expectedTag) {
            throw new Error("Release tag does not match package version");
          }
          if (!outputFile) {
            throw new Error("GITHUB_OUTPUT is required");
          }
          const tarballName = `${manifest.name}-${manifest.version}.tgz`;
          appendFileSync(outputFile, `tarball_name=${tarballName}\n`, "utf8");
          NODE
      - name: Build verified release candidate
        env:
          RELEASE_CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
        run: node ./scripts/release-package.mjs --output-dir "$RELEASE_CANDIDATE_DIR"
      - name: Upload exact release candidate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            ${{ runner.temp }}/release-candidate/${{ steps.package-identity.outputs.tarball_name }}
            ${{ runner.temp }}/release-candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - verify-build
      - package-tag
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Print tool versions
        run: |
          node --version
          gh --version
      - name: Download exact release candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
      - name: Re-verify downloaded checksum
        working-directory: ${{ runner.temp }}/release-candidate
        run: sha256sum --check SHA256SUMS
      - name: Reconcile draft release
        run: node ./scripts/release-draft.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
